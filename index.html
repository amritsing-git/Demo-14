<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#f5efe6">
  <title>Tigleo Candles — Handmade with Love</title>
  <link rel="stylesheet" href="style.css">
